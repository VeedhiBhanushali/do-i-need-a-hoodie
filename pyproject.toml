[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "do-i-need-a-hoodie"
version = "0.1.0"
description = "A weather-based clothing layer recommendation app"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Veedhi Bhanushali" },
  { name = "Joseph Lee" },
]

[tool.setuptools.packages.find]
where = ["src"]

